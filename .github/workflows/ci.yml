name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:release-versions
      - run: npx biome check src/ tests/
      - run: npx tsc --noEmit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  git-refresh-windows:
    name: Git Refresh on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git --version
      - run: npx vitest run tests/unit/git-state.test.ts tests/unit/git-refresh.test.ts tests/unit/git-lock.test.ts tests/unit/local-index-ownership.test.ts tests/unit/mcp-logging-protocol.test.ts
      - name: Verify JVM source-set resolution on Windows
        run: npx vitest run tests/unit/graph-resolution.test.ts -t "JVM multi-module resolution"
      - name: Verify TS/JS monorepo resolution on Windows
        run: npx vitest run tests/unit/graph-typescript.test.ts

  git-refresh-integration:
    name: Git Refresh with Qdrant and Ollama
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11435:11434
    env:
      QDRANT_MODE: external
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_HOST: 127.0.0.1
      QDRANT_PORT: 6333
      EMBEDDING_PROVIDER: ollama
      OLLAMA_MODE: external
      OLLAMA_URL: http://127.0.0.1:11435
      OLLAMA_HOST: http://127.0.0.1:11435
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare the real embedding model
        run: docker exec "${{ job.services.ollama.id }}" ollama pull nomic-embed-text
      - name: Verify Docker and run live Git refresh regressions
        run: |
          docker info
          npx vitest run tests/integration/git-refresh.test.ts tests/integration/git-refresh-mcp.test.ts

  node-floor-consumer-install:
    name: Node 18.17 Consumer Install
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 18.17.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify package installation at the declared Node floor
        shell: bash
        run: |
          set -euo pipefail
          qdrant_ready=false
          for attempt in {1..30}; do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              qdrant_ready=true
              break
            fi
            sleep 1
          done
          test "$qdrant_ready" = true
          repo_dir="$PWD"
          consumer_dir="$(mktemp -d)"
          npm pack --pack-destination "$consumer_dir"
          package_file="$(find "$consumer_dir" -maxdepth 1 -type f -name 'socraticode-*.tgz' -print -quit)"
          test -n "$package_file"
          cd "$consumer_dir"
          npm init --yes
          npm install --engine-strict "$package_file"
          test -f node_modules/socraticode/dist/index.js
          SOCRATICODE_AUTO_RESUME=off node node_modules/socraticode/dist/index.js < /dev/null
          QDRANT_MODE=external QDRANT_URL=http://127.0.0.1:6333 \
            node "$repo_dir/scripts/verify-packaged-qdrant.mjs" "$consumer_dir/node_modules/socraticode"

  node-26-consumer-qdrant:
    name: Node 26 Packaged Qdrant Smoke
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build

      # These regressions need a real Qdrant, so they live under
      # tests/integration/ and the unit matrix never reaches them. Run them here,
      # against this job's service container.
      #
      # Name each file rather than the directory: the rest of tests/integration/
      # needs an embedding service this job does not have. The first two stub
      # embedding readiness and generation; the third serves the embedding
      # endpoint itself from inside the test. Either way Qdrant and the
      # indexing, recovery and search paths stay real.
      #
      # REQUIRE_QDRANT=1 makes an unreachable backend fail the job rather than
      # letting describe.skipIf report a skipped success — the same reasoning as
      # the rust job's `rustc --version` step below. QDRANT_URL drives the
      # client; QDRANT_HOST/PORT are what the test helpers read, so both are set.
      - name: Qdrant-backed regressions
        shell: bash
        run: |
          set -euo pipefail
          qdrant_ready=false
          for attempt in {1..30}; do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              qdrant_ready=true
              break
            fi
            sleep 1
          done
          test "$qdrant_ready" = true
          REQUIRE_QDRANT=1 \
          QDRANT_MODE=external \
          QDRANT_URL=http://127.0.0.1:6333 \
          QDRANT_HOST=127.0.0.1 \
          QDRANT_PORT=6333 \
            npx vitest run \
              tests/integration/partial-upsert-skip.test.ts \
              tests/integration/interrupted-resume-recovery.test.ts \
              tests/integration/char-cap-split-retrieval.test.ts \
              tests/integration/prune-reclamation.test.ts \
              tests/integration/auto-cleanup.test.ts

      - name: Verify the unmodified package against Qdrant on Node 26
        shell: bash
        run: |
          set -euo pipefail
          qdrant_ready=false
          for attempt in {1..30}; do
            if curl --connect-timeout 1 --max-time 2 -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              qdrant_ready=true
              break
            fi
            sleep 1
          done
          test "$qdrant_ready" = true
          repo_dir="$PWD"
          consumer_dir="$(mktemp -d)"
          npm pack --pack-destination "$consumer_dir"
          package_file="$(find "$consumer_dir" -maxdepth 1 -type f -name 'socraticode-*.tgz' -print -quit)"
          test -n "$package_file"
          cd "$consumer_dir"
          npm init --yes
          npm install --engine-strict "$package_file"
          test -f node_modules/socraticode/dist/index.js
          SOCRATICODE_AUTO_RESUME=off node node_modules/socraticode/dist/index.js < /dev/null
          QDRANT_MODE=external QDRANT_HOST=127.0.0.1 QDRANT_PORT=6333 \
            node "$repo_dir/scripts/verify-packaged-qdrant.mjs" "$consumer_dir/node_modules/socraticode"

  # The one test that asks the compiler instead of asserting what we believe.
  # It lives under tests/integration/ because it runs a real `cargo check`, and
  # the unit job above does not reach it — so it gets a job of its own rather
  # than being counted as covered while never running.
  #
  # It skips itself where cargo is absent, which is what makes this job's
  # `rustc --version` step matter: without it a toolchain that quietly stopped
  # being installed would turn the test into a silent no-op, and a silent no-op
  # is how the two regressions this test exists to catch reached main in the
  # first place.
  rust-graph-vs-cargo:
    name: Rust graph vs cargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fail if the Rust toolchain is missing
        run: rustc --version && cargo --version
      - run: npm ci
      - run: npx vitest run tests/integration/rust-graph-vs-cargo.test.ts
